name: park_sg
description: "SENECAGLOBAL Smart Parking System - Seamless slot management, user-friendly booking, and efficient parking for modern campuses."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev



version: 2.0.0+2

environment:
  sdk: ^3.6.1


dependencies:
  flutter:
    sdk: flutter
  cloud_firestore:
  firebase_auth:



  device_info_plus: ^9.1.0
  file_picker:
  http: ^1.1.0
  excel: ^2.0.7
  universal_html: ^2.2.4
  csv: ^5.0.2
  provider:
  share_plus:
  path_provider: ^2.0.15
  permission_handler: ^11.0.1

  animated_text_kit:
  simple_animations:
  flutter_local_notifications:

  google_fonts:
  shared_preferences:
  firebase_messaging:
  in_app_update:
  intl:
  lottie: ^3.1.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter




  flutter_lints: ^5.0.0


flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/sg.json
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  fonts:
    - family: Mont
      fonts:
        - asset: fonts/Montserrat/Montserrat-VariableFont_wght.ttf
          weight: 700
        - asset: fonts/Montserrat/Montserrat-Italic-VariableFont_wght.ttf
          style: italic


